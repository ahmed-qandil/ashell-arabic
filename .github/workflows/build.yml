name: Build Arabic release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/aShell-v0.31-ar1-unsigned.apk"
          zip -r "dist/aShell-v0.31-ar1-source.zip" . -x "./.git/*" "./dist/*" "./app/build/*" "./.gradle/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.31-ar1
          name: aShell Arabic v0.31-ar1
          body: |
            Arabic localized, accessibility-friendly custom build of aShell (upstream v0.31, github.com/sunilpaulmathew/aShell, GPLv3).
            - Full Arabic translation (values-ar) covering every string, including previously hardcoded ones.
            - TalkBack labels added to icon-only buttons.
            - Completely clean settings: removed version/copyright row, Learn Shizuku link, Translations link, Privacy policy entry, Contact developer link; GitLab/POEditor mention stripped from the welcome text; Shizuku-not-found dialog link removed.
            - No defaults of user-toggleable settings changed.
            - Unsigned release APK: sign it yourself before installing.
          files: dist/*
